<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ブラウザRDPクライアント</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="login-panel" class="panel active">
        <div class="login-container">
            <h1>RDP接続</h1>
            <form id="loginForm">
                <div class="form-group">
                    <label for="hostname">接続先ホスト:</label>
                    <input type="text" id="hostname" name="hostname" placeholder="例: 192.168.1.100 または hostname.com" required>
                </div>
                <div class="form-group">
                    <label for="port">ポート:</label>
                    <input type="number" id="port" name="port" value="3389" required>
                </div>
                <div class="form-group">
                    <label for="username">ユーザー名:</label>
                    <input type="text" id="username" name="username" placeholder="例: Administrator" required>
                </div>
                <div class="form-group">
                    <label for="password">パスワード:</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div class="form-group">
                    <label for="domain">ドメイン (オプション):</label>
                    <input type="text" id="domain" name="domain" placeholder="例: DOMAIN または 空白">
                </div>
                <button type="submit" class="btn-connect">接続</button>
            </form>
            <div id="loginStatus" class="status-message"></div>
        </div>
    </div>

    <div id="desktop-panel" class="panel">
        <div id="toolbar">
            <div class="toolbar-left">
                <span id="connectionStatus">接続中...</span>
            </div>
            <div class="toolbar-right">
                <button id="disconnectBtn" class="btn-disconnect">切断</button>
            </div>
        </div>
        <div id="screen-container">
            <div id="rdp-container"></div>
        </div>
    </div>

    <!-- guacd クライアントライブラリ -->
    <script src="https://cdn.jsdelivr.net/npm/guacamole-common-js@1.5.0/all.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
