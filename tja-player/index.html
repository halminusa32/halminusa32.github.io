<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Advanced TJA Player</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="ui-container">
        <h2>TJA Web Player Pro</h2>
        <div class="file-inputs">
            <div class="input-group">
                <label>TJAファイル (.tja)</label>
                <input type="file" id="tja-file" accept=".tja">
            </div>
            <div class="input-group">
                <label>音源ファイル (.ogg, .mp3)</label>
                <input type="file" id="audio-file" accept=".ogg, .mp3">
            </div>
        </div>
        <button id="play-btn" disabled>演奏開始</button>
        <p id="status-msg"></p>
    </div>

    <div id="game-screen">
        <div id="info-panel">
            <span id="title-display">TITLE: --</span>
            <span id="bpm-display">BPM: --</span>
        </div>
        <div id="lane"></div>
        <div id="judge-line"><div id="flash"></div></div>
        <div id="note-container"></div>
        
        <div id="hud-container">
            <div id="combo-display">0</div>
            <div id="mini-taiko">
                <div class="face"></div>
                <div class="rim-l"></div>
                <div class="rim-r"></div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
