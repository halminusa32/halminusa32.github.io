<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TJA Web Player</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="ui-container">
        <h2>TJA Web Player</h2>
        <div class="file-input-group">
            <label>1. TJAファイル:</label>
            <input type="file" id="tja-file" accept=".tja">
        </div>
        <div class="file-input-group">
            <label>2. 音源 (ogg/mp3):</label>
            <input type="file" id="audio-file" accept="audio/*">
        </div>
        <button id="play-btn" disabled>再生開始</button>
    </div>

    <div id="game-screen">
        <div id="lane"></div>
        <div id="judge-line"></div>
        <div id="note-container"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
