<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TJA Web Player + Mini Taiko</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="ui-container">
        <h2>TJA Web Player</h2>
        <div class="file-input-group">
            <label>1. TJAファイル: <input type="file" id="tja-file" accept=".tja"></label>
        </div>
        <div class="file-input-group">
            <label>2. 音源 (ogg/mp3): <input type="file" id="audio-file" accept="audio/*"></label>
        </div>
        <button id="play-btn" disabled>再生開始</button>
        <p style="font-size: 12px; color: #aaa;">操作: F, J (ドン) / D, K (カッ)</p>
    </div>

    <div id="game-screen">
        <div id="lane"></div>
        <div id="judge-line">
            <div id="flash"></div>
        </div>
        <div id="note-container"></div>
        
        <div id="hud-container">
            <div id="combo-display">0</div>
            <div id="mini-taiko">
                <div class="face"></div> <div class="rim-l"></div> <div class="rim-r"></div> </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
