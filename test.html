<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>otoware.wav</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;
    background: transparent;
    font-family:
        "gg sans",
        "Noto Sans",
        "Segoe UI",
        Arial,
        sans-serif;
}

body {
    padding: 10px;
}

.audio-card {
    width: 420px;
    max-width: 100%;
    background: #1e1f22;
    color: #dbdee1;
    border-radius: 8px;
    padding: 10px 12px;
    user-select: none;
}

/* ファイル情報 */

.audio-metadata {
    display: flex;
    align-items: center;
    margin-bottom: 8px;
}

.file-icon {
    width: 30px;
    height: 36px;
    margin-right: 9px;
    flex-shrink: 0;
    background: #5865f2;
    border-radius: 3px;
    position: relative;
}

.file-icon::before {
    content: "";
    position: absolute;
    right: 0;
    top: 0;
    width: 9px;
    height: 9px;
    background: #1e1f22;
    clip-path: polygon(
        0 0,
        100% 100%,
        0 100%
    );
}

.file-icon::after {
    content: "🔊";
    position: absolute;
    left: 5px;
    bottom: 4px;
    font-size: 14px;
}

.metadata-content {
    min-width: 0;
}

.filename {
    color: #00a8fc;
    font-size: 14px;
    line-height: 18px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.filesize {
    color: #b5bac1;
    font-size: 11px;
    line-height: 15px;
}

/* プレイヤー */

.audio-controls {
    display: flex;
    align-items: center;
    width: 100%;
    height: 28px;
    gap: 8px;
}

.play-button {
    width: 27px;
    height: 27px;
    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    border: 0;
    padding: 0;
    border-radius: 4px;

    background: transparent;
    color: #dbdee1;

    cursor: pointer;
    font-size: 18px;
}

.play-button:hover {
    background: #35373c;
    color: white;
}

.duration-wrapper {
    display: flex;
    align-items: center;
    gap: 4px;

    flex-shrink: 0;

    color: #b5bac1;
    font-family: Consolas, monospace;
    font-size: 11px;
}

.duration-display {
    min-width: 32px;
    text-align: center;
}

.duration-separator {
    color: #72767d;
}

/* シークバー */

.seek-wrapper {
    position: relative;
    flex: 1;
    height: 20px;

    display: flex;
    align-items: center;

    cursor: pointer;
}

.seek-bar {
    position: relative;
    width: 100%;
    height: 4px;

    background: #4e5058;
    border-radius: 2px;
}

.seek-buffer {
    position: absolute;
    left: 0;
    top: 0;

    height: 100%;
    width: 100%;

    background: #686b75;
    border-radius: 2px;
}

.seek-progress {
    position: absolute;
    left: 0;
    top: 0;

    height: 100%;
    width: 0%;

    background: #5865f2;
    border-radius: 2px;
}

.seek-grabber {
    position: absolute;
    right: -5px;
    top: 50%;

    width: 10px;
    height: 10px;

    transform: translateY(-50%);

    background: #5865f2;
    border-radius: 50%;

    opacity: 0;
}

.seek-wrapper:hover .seek-grabber {
    opacity: 1;
}

/* 音量 */

.volume-container {
    position: relative;
    flex-shrink: 0;
}

.volume-button {
    width: 28px;
    height: 28px;

    display: flex;
    align-items: center;
    justify-content: center;

    border: 0;
    border-radius: 4px;

    background: transparent;
    color: #b5bac1;

    cursor: pointer;
    font-size: 17px;
}

.volume-button:hover {
    background: #35373c;
    color: white;
}

.volume-popup {
    position: absolute;

    display: none;

    right: 0;
    bottom: 35px;

    width: 130px;
    padding: 10px;

    background: #111214;
    border-radius: 6px;

    box-shadow:
        0 5px 20px rgba(0,0,0,.45);

    z-index: 20;
}

.volume-popup.show {
    display: block;
}

.volume-slider {
    appearance: none;

    width: 100%;
    height: 4px;

    background: #4e5058;
    border-radius: 2px;

    outline: none;
}

.volume-slider::-webkit-slider-thumb {
    appearance: none;

    width: 10px;
    height: 10px;

    background: #5865f2;
    border-radius: 50%;

    cursor: pointer;
}

.volume-slider::-moz-range-thumb {
    width: 10px;
    height: 10px;

    border: 0;

    background: #5865f2;
    border-radius: 50%;

    cursor: pointer;
}

.status {
    display: none;

    margin-top: 6px;

    color: #b5bac1;
    font-size: 11px;
}

.audio-card.show-status .status {
    display: block;
}
</style>
</head>

<body>

<div class="audio-card" id="card">

    <div class="audio-metadata">

        <div class="file-icon"></div>

        <div class="metadata-content">

            <div class="filename">
                otoware.wav
            </div>

            <div class="filesize" id="filesize">
                読み込み中...
            </div>

        </div>

    </div>


    <div class="audio-controls">

        <button
            class="play-button"
            id="playButton"
            aria-label="プレイ"
        >▶</button>


        <div class="duration-wrapper">

            <span
                class="duration-display"
                id="currentTime"
            >0:00</span>

            <span class="duration-separator">/</span>

            <span
                class="duration-display"
                id="duration"
            >0:00</span>

        </div>


        <div
            class="seek-wrapper"
            id="seekWrapper"
        >

            <div class="seek-bar">

                <div
                    class="seek-buffer"
                ></div>

                <div
                    class="seek-progress"
                    id="seekProgress"
                >
                    <span class="seek-grabber"></span>
                </div>

            </div>

        </div>


        <div class="volume-container">

            <button
                class="volume-button"
                id="volumeButton"
                aria-label="音量をコントロールする"
            >🔊</button>

            <div
                class="volume-popup"
                id="volumePopup"
            >

                <input
                    class="volume-slider"
                    id="volumeSlider"
                    type="range"
                    min="0"
                    max="1"
                    step="0.001"
                    value="1"
                >

            </div>

        </div>

    </div>


    <div class="status" id="status">
        自動再生がブロックされました。クリックして再生
    </div>

</div>


<script>
"use strict";

/*
============================================================
  設定
============================================================
*/

const AUDIO_URL = "./wav/otoware.wav";

const CHUNK_FRAMES = 4096;


/*
============================================================
  DOM
============================================================
*/

const card =
    document.getElementById("card");

const playButton =
    document.getElementById("playButton");

const currentTime =
    document.getElementById("currentTime");

const durationDisplay =
    document.getElementById("duration");

const seekWrapper =
    document.getElementById("seekWrapper");

const seekProgress =
    document.getElementById("seekProgress");

const volumeButton =
    document.getElementById("volumeButton");

const volumePopup =
    document.getElementById("volumePopup");

const volumeSlider =
    document.getElementById("volumeSlider");

const filesize =
    document.getElementById("filesize");

const status =
    document.getElementById("status");


/*
============================================================
  AudioWorklet

  ここでは受け取ったFloat32サンプルを

      変更せず

  そのまま出力する。
============================================================
*/

const workletCode = `

class FloatPlayerProcessor extends AudioWorkletProcessor {

    constructor() {

        super();

        this.queue = [];

        this.current = null;

        this.offset = 0;

        this.playing = false;

        this.port.onmessage = event => {

            const data = event.data;

            if (data.type === "chunk") {

                this.queue.push(data.channels);

            }

            else if (data.type === "start") {

                this.playing = true;

            }

            else if (data.type === "stop") {

                this.playing = false;

                this.queue = [];

                this.current = null;

                this.offset = 0;
            }

            else if (data.type === "clear") {

                this.queue = [];

                this.current = null;

                this.offset = 0;
            }
        };
    }


    process(inputs, outputs) {

        const output = outputs[0];

        if (!output || output.length === 0)
            return true;


        const left = output[0];

        const right =
            output.length > 1
                ? output[1]
                : null;


        /*
         * 出力バッファを埋める。
         *
         * 重要:
         *
         * 値を -1～1 に制限しない。
         * Math.max / Math.min もしない。
         * 正規化もしない。
         */

        for (
            let i = 0;
            i < left.length;
            i++
        ) {

            if (!this.playing) {

                left[i] = 0;

                if (right)
                    right[i] = 0;

                continue;
            }


            if (
                !this.current ||
                this.offset >=
                this.current[0].length
            ) {

                if (this.queue.length > 0) {

                    this.current =
                        this.queue.shift();

                    this.offset = 0;

                } else {

                    left[i] = 0;

                    if (right)
                        right[i] = 0;

                    continue;
                }
            }


            /*
             * Float32サンプルをそのままコピー。
             */

            left[i] =
                this.current[0][this.offset];


            if (right) {

                right[i] =
                    this.current.length > 1
                        ? this.current[1][this.offset]
                        : this.current[0][this.offset];
            }


            this.offset++;
        }


        return true;
    }
}


registerProcessor(
    "float-player",
    FloatPlayerProcessor
);

`;


/*
============================================================
  WAV解析
============================================================
*/

function readString(view, offset, length) {

    let result = "";

    for (
        let i = 0;
        i < length;
        i++
    ) {
        result += String.fromCharCode(
            view.getUint8(offset + i)
        );
    }

    return result;
}


function parseWav(buffer) {

    const view =
        new DataView(buffer);

    let offset = 0;


    if (
        readString(
            view,
            0,
            4
        ) !== "RIFF"
    ) {
        throw new Error(
            "RIFF WAVではありません"
        );
    }


    if (
        readString(
            view,
            8,
            4
        ) !== "WAVE"
    ) {
        throw new Error(
            "WAVE形式ではありません"
        );
    }


    offset = 12;


    let format = null;
    let dataOffset = null;
    let dataSize = null;


    while (
        offset + 8 <=
        view.byteLength
    ) {

        const id =
            readString(
                view,
                offset,
                4
            );

        const size =
            view.getUint32(
                offset + 4,
                true
            );

        const chunkStart =
            offset + 8;


        if (id === "fmt ") {

            const audioFormat =
                view.getUint16(
                    chunkStart,
                    true
                );

            const channels =
                view.getUint16(
                    chunkStart + 2,
                    true
                );

            const sampleRate =
                view.getUint32(
                    chunkStart + 4,
                    true
                );

            const bits =
                view.getUint16(
                    chunkStart + 14,
                    true
                );


            format = {
                audioFormat,
                channels,
                sampleRate,
                bits
            };
        }


        if (id === "data") {

            dataOffset =
                chunkStart;

            dataSize =
                size;

            break;
        }


        offset =
            chunkStart +
            size +
            (size & 1);
    }


    if (!format)
        throw new Error(
            "fmtチャンクがありません"
        );


    if (
        dataOffset === null
    )
        throw new Error(
            "dataチャンクがありません"
        );


    /*
     * IEEE Float WAV
     *
     * WAVE_FORMAT_IEEE_FLOAT = 3
     *
     * 32bit Float = 32
     */

    if (
        format.audioFormat !== 3 ||
        format.bits !== 32
    ) {

        throw new Error(
            "32-bit IEEE Float WAVではありません"
        );
    }


    return {
        ...format,
        dataOffset,
        dataSize
    };
}


/*
============================================================
  時間
============================================================
*/

function formatTime(seconds) {

    if (!Number.isFinite(seconds))
        return "0:00";

    seconds =
        Math.max(
            0,
            Math.floor(seconds)
        );

    const m =
        Math.floor(seconds / 60);

    const s =
        seconds % 60;

    return (
        m +
        ":" +
        String(s).padStart(2, "0")
    );
}


/*
============================================================
  メイン
============================================================
*/

let audioContext = null;

let workletNode = null;

let gainNode = null;

let wavBuffer = null;

let wavInfo = null;

let playing = false;

let startTime = 0;

let pausedPosition = 0;

let animationId = 0;


/*
============================================================
  初期化
============================================================
*/

async function initialize() {

    /*
     * WAVを読み込む。
     */

    const response =
        await fetch(
            AUDIO_URL,
            {
                cache: "no-store"
            }
        );


    if (!response.ok) {

        throw new Error(
            "WAVを読み込めません: HTTP " +
            response.status
        );
    }


    wavBuffer =
        await response.arrayBuffer();


    /*
     * WAVヘッダ解析
     */

    wavInfo =
        parseWav(wavBuffer);


    /*
     * ファイルサイズ
     */

    const mb =
        wavBuffer.byteLength /
        1024 /
        1024;

    filesize.textContent =
        mb >= 1
            ? mb.toFixed(2) + " MB"
            : (
                wavBuffer.byteLength /
                1024
            ).toFixed(2) + " KB";


    /*
     * 時間
     */

    const bytesPerFrame =
        wavInfo.channels * 4;

    const frames =
        wavInfo.dataSize /
        bytesPerFrame;

    const length =
        frames /
        wavInfo.sampleRate;

    durationDisplay.textContent =
        formatTime(length);


    /*
     * AudioContext
     */

    audioContext =
        new AudioContext({
            sampleRate:
                wavInfo.sampleRate
        });


    /*
     * AudioWorklet登録
     */

    const blob =
        new Blob(
            [workletCode],
            {
                type:
                    "application/javascript"
            }
        );

    const url =
        URL.createObjectURL(blob);


    await audioContext.audioWorklet.addModule(
        url
    );


    URL.revokeObjectURL(url);


    /*
     * Worklet
     */

    workletNode =
        new AudioWorkletNode(
            audioContext,
            "float-player",
            {
                numberOfInputs: 0,
                numberOfOutputs: 1,
                outputChannelCount: [
                    Math.min(
                        2,
                        wavInfo.channels
                    )
                ]
            }
        );


    /*
     * GainNode
     *
     * 初期値1.0。
     *
     * つまり「何も小さくしない」。
     */

    gainNode =
        audioContext.createGain();

    gainNode.gain.value = 1;


    /*
     * Worklet → Gain → 出力
     */

    workletNode.connect(
        gainNode
    );

    gainNode.connect(
        audioContext.destination
    );


    /*
     * 再生
     */

    await play();


    updateUI();
}


/*
============================================================
  チャンク送信
============================================================
*/

function sendAudioFrom(position) {

    const channels =
        wavInfo.channels;

    const bytesPerFrame =
        channels * 4;

    const totalFrames =
        wavInfo.dataSize /
        bytesPerFrame;


    /*
     * 最初からCHUNK単位でWorkletへ送る。
     */

    for (
        let frame = position;
        frame < totalFrames;
        frame += CHUNK_FRAMES
    ) {

        const count =
            Math.min(
                CHUNK_FRAMES,
                totalFrames - frame
            );


        const channelData =
            [];


        for (
            let c = 0;
            c < channels;
            c++
        ) {

            /*
             * Float32Arrayを作る。
             */

            const data =
                new Float32Array(
                    count
                );


            const base =
                wavInfo.dataOffset +
                frame * bytesPerFrame +
                c * 4;


            /*
             * Float32の値を
             * そのままコピー。
             */

            const view =
                new DataView(
                    wavBuffer,
                    base,
                    count * 4
                );


            for (
                let i = 0;
                i < count;
                i++
            ) {

                data[i] =
                    view.getFloat32(
                        i * 4,
                        true
                    );
            }


            channelData.push(data);
        }


        /*
         * TransferableとしてWorkletへ渡す。
         */

        workletNode.port.postMessage(
            {
                type: "chunk",
                channels: channelData
            },
            channelData.map(
                x => x.buffer
            )
        );
    }
}


/*
============================================================
  再生
============================================================
*/

async function play() {

    if (!audioContext)
        return;


    /*
     * AudioContextが停止していたら復帰。
     */

    if (
        audioContext.state ===
        "suspended"
    ) {

        await audioContext.resume();
    }


    /*
     * 現在位置から送る。
     */

    workletNode.port.postMessage({
        type: "clear"
    });


    const sampleRate =
        wavInfo.sampleRate;

    const frame =
        Math.floor(
            pausedPosition *
            sampleRate
        );


    sendAudioFrom(frame);


    workletNode.port.postMessage({
        type: "start"
    });


    /*
     * 再生開始時刻を記録。
     */

    startTime =
        audioContext.currentTime -
        pausedPosition;


    playing = true;

    playButton.textContent = "❚❚";

    card.classList.remove(
        "show-status"
    );
}


/*
============================================================
  一時停止
============================================================
*/

async function pause() {

    if (!audioContext)
        return;


    pausedPosition =
        getCurrentPosition();


    workletNode.port.postMessage({
        type: "stop"
    });


    playing = false;

    playButton.textContent = "▶";
}


/*
============================================================
  現在位置
============================================================
*/

function getCurrentPosition() {

    if (!audioContext)
        return 0;

    if (!playing)
        return pausedPosition;


    const duration =
        wavInfo.dataSize /
        (
            wavInfo.channels *
            4 *
            wavInfo.sampleRate
        );


    let position =
        audioContext.currentTime -
        startTime;


    /*
     * 強制ループ
     */

    if (position >= duration) {

        position =
            position % duration;
    }


    return position;
}


/*
============================================================
  UI更新
============================================================
*/

function updateUI() {

    if (!wavInfo)
        return;


    const total =
        wavInfo.dataSize /
        (
            wavInfo.channels *
            4 *
            wavInfo.sampleRate
        );


    const position =
        getCurrentPosition();


    currentTime.textContent =
        formatTime(position);


    const percent =
        total > 0
            ? position / total * 100
            : 0;


    seekProgress.style.width =
        percent + "%";


    /*
     * ループ判定
     */

    if (
        playing &&
        position >= total - 0.03
    ) {

        /*
         * 新しいWorkletストリームを
         * 最初から開始。
         */

        workletNode.port.postMessage({
            type: "clear"
        });

        sendAudioFrom(0);

        startTime =
            audioContext.currentTime;
    }


    animationId =
        requestAnimationFrame(
            updateUI
        );
}


/*
============================================================
  再生ボタン
============================================================
*/

playButton.addEventListener(
    "click",
    async event => {

        event.stopPropagation();

        if (playing) {

            await pause();

        } else {

            await play();
        }
    }
);


/*
============================================================
  シーク
============================================================
*/

seekWrapper.addEventListener(
    "click",
    async event => {

        if (!wavInfo)
            return;


        const rect =
            seekWrapper.getBoundingClientRect();


        const percent =
            Math.max(
                0,
                Math.min(
                    1,
                    (
                        event.clientX -
                        rect.left
                    ) /
                    rect.width
                )
            );


        const total =
            wavInfo.dataSize /
            (
                wavInfo.channels *
                4 *
                wavInfo.sampleRate
            );


        pausedPosition =
            percent * total;


        if (playing) {

            await play();

        } else {

            currentTime.textContent =
                formatTime(
                    pausedPosition
                );

            seekProgress.style.width =
                percent * 100 + "%";
        }
    }
);


/*
============================================================
  音量
============================================================
*/

volumeButton.addEventListener(
    "click",
    event => {

        event.stopPropagation();

        volumePopup.classList.toggle(
            "show"
        );
    }
);


volumeSlider.addEventListener(
    "input",
    () => {

        /*
         * ここだけ出力ゲインを変更する。
         *
         * WAVのサンプル値そのものには
         * 一切触れていない。
         */

        if (gainNode) {

            gainNode.gain.value =
                Number(
                    volumeSlider.value
                );
        }


        const value =
            Number(
                volumeSlider.value
            );


        if (value === 0) {

            volumeButton.textContent =
                "🔇";

        } else if (value < 0.5) {

            volumeButton.textContent =
                "🔈";

        } else {

            volumeButton.textContent =
                "🔊";
        }
    }
);


/*
============================================================
  外側クリック
============================================================
*/

document.addEventListener(
    "click",
    () => {

        volumePopup.classList.remove(
            "show"
        );
    }
);


/*
============================================================
  自動再生
============================================================
*/

async function start() {

    try {

        await initialize();

    } catch (error) {

        console.error(error);

        status.textContent =
            "再生エラー: " +
            error.message;

        card.classList.add(
            "show-status"
        );
    }
}


/*
============================================================
  初回起動
============================================================
*/

window.addEventListener(
    "load",
    () => {

        start();
    }
);


/*
 * 自動再生がブラウザに拒否された場合、
 * カードクリックでAudioContextをresume。
 */

card.addEventListener(
    "click",
    async () => {

        if (!audioContext)
            return;


        if (
            audioContext.state ===
            "suspended"
        ) {

            try {

                await audioContext.resume();

                if (!playing)
                    await play();

            } catch {}
        }
    }
);

</script>

</body>
</html>
