<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>タイピング練習（PC・タブレット専用）</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="device-block" class="hidden">
    <h2>このサイトはPC・タブレット専用です</h2>
    <p>スマートフォン等ではご利用いただけません。</p>
  </div>

  <div id="app">
    <div id="login-area">
      <h1>タイピング練習</h1>
      <p>ユーザー名を入力してください（ローカル保存）</p>
      <input type="text" id="username" maxlength="16" placeholder="ユーザー名">
      <button id="login-btn">はじめる</button>
    </div>

    <div id="main-area" class="hidden">
      <div class="header">
        <span id="user-label"></span>
        <button id="logout-btn" title="ログアウト">ログアウト</button>
      </div>
      <div id="typing-box">
        <div id="question"></div>
        <input type="text" id="answer" autocomplete="off" placeholder="ここに入力">
        <div id="timer-score">
          <span id="timer">00.00s</span>
          <span id="score"></span>
        </div>
        <button id="next-btn" class="hidden">次の問題</button>
      </div>
      <div id="history-area">
        <h3>履歴</h3>
        <ul id="history-list"></ul>
        <button id="clear-history-btn">履歴をクリア</button>
      </div>
    </div>
  </div>
  <script src="main.js"></script>
</body>
</html>
