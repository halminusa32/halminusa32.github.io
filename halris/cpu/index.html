<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>HALRIS - VS CPU</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="start-screen">
        <h1 style="color: #9b59b6; letter-spacing: 5px;">VS CPU</h1>
        <button id="start-button">READY?</button>
        <a href="../" style="margin-top:15px; color:#888; text-decoration:none; font-size:14px;">BACK TO MENU</a>
    </div>

    <div id="game-ui" class="game-layout" style="display:none;">
        <div id="game-container">
            <div class="side-panel">
                <div class="label">HOLD</div>
                <canvas id="hold-canvas" width="60" height="60"></canvas>
            </div>
            <canvas id="tetris" width="240" height="480"></canvas>
            <div class="side-panel">
                <div class="label">NEXT</div>
                <canvas id="next-canvas" width="60" height="180"></canvas>
            </div>
        </div>

        <div class="enemy-container">
            <div class="enemy-label">CPU (LV.1)</div>
            <canvas id="enemy-tetris" width="240" height="480"></canvas>
        </div>
    </div>

    <div id="game-over-screen">
        <h1>GAME OVER</h1>
        <button id="restart-button">RETRY</button>
        <a href="../" class="btn-link">MENU</a>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
