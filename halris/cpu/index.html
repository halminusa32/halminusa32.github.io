<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Gemini AI Tetris Battle</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <div id="start-screen">
            <h1>GEMINI AI TETRIS</h1>
            <p>Google AI Studioで取得したAPIキーを入力してください</p>
            <input type="password" id="api-key-input" placeholder="Enter Gemini API Key">
            <div class="difficulty-selection">
                <button class="start-btn" id="start-game-btn">GAME START</button>
            </div>
            <p style="font-size: 10px; color: #666; margin-top: 10px;">※キーはGitHubには保存されず、ブラウザ内でのみ使用されます</p>
        </div>

        <div id="game-ui" style="display: none;">
            <div class="player-side">
                <div class="label">PLAYER (O-Spin)</div>
                <div class="canvas-group">
                    <canvas id="tetris" width="240" height="480"></canvas>
                </div>
            </div>
            <div class="ai-side">
                <div class="label">GEMINI AI (4-Wide)</div>
                <div class="canvas-group">
                    <canvas id="enemy-tetris" width="240" height="480"></canvas>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="script.js"></script>
</body>
</html>
