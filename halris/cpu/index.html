<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HALRIS - VS CPU</title>
    <link rel="stylesheet" href="../solo/style.css">
    <style>
        .game-layout { display: flex; gap: 40px; align-items: start; justify-content: center; margin-top: 20px; }
        .side-container { display: flex; flex-direction: column; align-items: center; }
        .enemy-label { color: #9b59b6; font-weight: bold; margin-bottom: 10px; font-size: 1.2rem; text-shadow: 0 0 10px #9b59b6; }
        #enemy-tetris { border: 2px solid #333; background: #000; box-shadow: 0 0 20px rgba(155, 89, 182, 0.3); opacity: 0.8; }
        @media (max-width: 800px) { .game-layout { transform: scale(0.7); gap: 10px; } }
    </style>
</head>
<body>
    <div class="background-anim"></div>
    <div class="game-layout">
        <div class="side-container">
            <div class="enemy-label" style="color:#2ecc71; text-shadow:0 0 10px #2ecc71;">PLAYER</div>
            <div id="game-container">
                <div class="side-panel">
                    <div class="label">HOLD</div>
                    <canvas id="hold-canvas" width="60" height="60"></canvas>
                </div>
                <canvas id="tetris" width="240" height="480"></canvas>
                <div class="side-panel">
                    <div class="label">NEXT</div>
                    <canvas id="next-canvas" width="60" height="180"></canvas>
                </div>
            </div>
        </div>

        <div class="side-container">
            <div class="enemy-label">CPU LV.1</div>
            <canvas id="enemy-tetris" width="240" height="480"></canvas>
        </div>
    </div>

    <div id="game-over-screen" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); flex-direction:column; justify-content:center; align-items:center; z-index:100;">
        <h1 style="color:white; font-size:3rem;">GAME OVER</h1>
        <button id="restart-button" style="padding:15px 40px; font-size:1.2rem; cursor:pointer; background:#9b59b6; color:white; border:none; border-radius:10px;">RETRY</button>
        <a href="../" style="margin-top:20px; color:#aaa; text-decoration:none;">BACK TO MENU</a>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
