<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HALRIS SOLO</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="side-info">
        <h1>HALRIS SOLO</h1>
        <div class="line-container">
            <div class="label">SCORE</div>
            <div id="score-display">0</div>
            
            <div class="label" style="margin-top:10px;">LINES</div>
            <div id="line-count">0</div>
            
            <div class="label" style="margin-top:10px; position: relative;">
                LEVEL
                <div id="level-up-text">LEVEL UP!</div>
            </div>
            <div id="level">1</div>

            <div class="label" style="margin-top:20px; color: #ff3333;">LINE CLEAR DELAY (F)</div>
            <div style="display: flex; align-items: center; gap: 8px; margin-top: 5px;">
                <input type="range" id="delay-slider" min="0" max="60" value="1" style="width: 80px;">
                <input type="number" id="delay-input" min="0" max="60" value="1" style="width: 40px; background: #222; border: 1px solid #444; color: #00eeee; text-align: center; border-radius: 4px;">
            </div>
        </div>
    </div>
    
    <div id="room-setup">
        <button id="play" class="btn gray">START</button>
    </div>

    <div id="game-container" style="display: none;">
        <div class="player-section side">
            <div class="label">HOLD</div>
            <canvas id="hold-canvas" width="60" height="60"></canvas>
            <div class="label" style="margin-top:20px;">NEXT</div>
            <canvas id="next-canvas" width="60" height="180"></canvas>
        </div>
        <div class="player-section">
            <canvas id="tetris" width="240" height="480"></canvas>
        </div>
    </div>

    <div id="game-over-screen" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); flex-direction:column; justify-content:center; align-items:center; z-index:1000;">
        <h2 style="color:#f33; font-size:40px;">GAME OVER</h2>
        <p id="final-score">SCORE: 0</p>
        <button id="restart-button" class="btn gray">RESTART</button>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
