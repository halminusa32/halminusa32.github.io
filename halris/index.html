<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HALRIS ONLINE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>HALRIS ONLINE</h1>
    <div id="room-setup">
        <input type="text" id="room-id" placeholder="招待コードを入力">
        <div class="join-buttons">
            <button id="btn-p1" class="btn gray">1P</button>
            <button id="btn-p2" class="btn gray">2P</button>
        </div>
    </div>
    <div id="game-container" style="display: none;">
        <div class="player-section side">
            <div class="label">HOLD</div>
            <canvas id="hold-canvas" width="60" height="60"></canvas>
            <div class="label" style="margin-top:20px;">NEXT</div>
            <canvas id="next-canvas" width="60" height="60"></canvas>
        </div>

        <div class="player-section">
            <div class="label">YOU</div>
            <canvas id="tetris" width="240" height="480"></canvas>
        </div>

        <div class="player-section enemy">
            <div class="label">ENEMY</div>
            <canvas id="enemy-tetris" width="180" height="360"></canvas>
            <div id="enemy-score" class="value">0</div>
        </div>
    </div>
    <div class="touch-controls">
        <div class="control-row">
            <button id="ctrl-hold" class="btn gray" style="width:80px">HOLD</button>
            <button id="ctrl-up" class="btn blue">HARD DROP</button>
        </div>
        <div class="control-row">
            <button id="ctrl-left" class="btn">←</button>
            <button id="ctrl-down" class="btn">↓</button>
            <button id="ctrl-right" class="btn">→</button>
            <div class="rotate-group">
                <button id="ctrl-rot-l" class="btn purple">Z</button>
                <button id="ctrl-rot-r" class="btn purple">X</button>
            </div>
        </div>
    </div>
    <script type="module" src="script.js"></script>
</body>
</html>
