<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HALRIS - SELECT MODE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="background-anim"></div>
    
    <div class="main-content">
        <h1 class="title-anim">HALRIS</h1>

        <div class="container">
            <a href="./solo/" class="mode-card solo fade-in-delay1">
                <div class="icon">👤</div>
                <div class="card-title">Solo Play</div>
                <div class="desc">空中で(も)毎秒10回回転でO/S/Z-Spinできる<br>あとゴースト見えにくいけど我慢して</div>
            </a>

            <a href="./multi/" class="mode-card multi fade-in-delay2">
                <div class="icon">⚔️</div>
                <div class="card-title">Multi Play</div>
                <div class="desc">失敗作(同期上手く行かない)</div>
            </a>

            <a href="./cpu/" class="mode-card cpu fade-in-delay3">
                <div class="icon">🤖</div>
                <div class="card-title">VS CPU</div>
                <div class="desc">これも失敗作(Gemini API取得しても機能しない)</div>
            </a>

        </div>
    </div>
    
</body>
</html>
