<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>MultiPlay - TETRIS ONLINE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="room-setup">
        <input type="text" id="room-id" placeholder="ルームコード">
        <div class="setup-buttons">
            <button id="btn-p1">1P参加</button>
            <button id="btn-p2">2P参加</button>
        </div>
        <a href="../" style="color:#aaa; display:block; margin-top:20px;">TOPへ戻る</a>
    </div>

    <div id="game-container" style="display:none;">
        <div class="side-panel">
            <div class="label">HOLD</div>
            <canvas id="hold-canvas" width="60" height="60"></canvas>
            <div class="label" style="margin-top:20px;">SCORE</div>
            <div id="score">0</div>
        </div>

        <div class="main-panel">
            <div class="label">YOU</div>
            <canvas id="tetris" width="240" height="480"></canvas>
        </div>

        <div class="main-panel">
            <div class="label">ENEMY</div>
            <canvas id="enemy-tetris" width="240" height="480"></canvas>
            <div class="label" style="margin-top:10px;">ENEMY SCORE: <span id="enemy-score">0</span></div>
        </div>

        <div class="side-panel">
            <div class="label">NEXT</div>
            <canvas id="next-canvas" width="60" height="180"></canvas>
        </div>
    </div>

    <div id="controls">
        <div class="row"><button id="ctrl-hold">HOLD</button><button id="ctrl-up">HARD</button><button id="ctrl-rot-r">ROT</button></div>
        <div class="row"><button id="ctrl-left">←</button><button id="ctrl-down">↓</button><button id="ctrl-right">→</button></div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
