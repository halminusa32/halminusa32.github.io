<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>TJA Pro Editor - Mekadesu Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-content">
            <h1>TJA Pro Editor <span id="gogoLamp">GOGO TIME</span></h1>
            <div class="top-controls">
                <label class="file-label">🎵 音楽読込 (.ogg)<input type="file" id="audioFile" accept="audio/ogg, audio/mpeg"></label>
                <button id="openConfig" class="mini-btn">⌨️ キー設定</button>
            </div>
        </div>
    </header>

    <div id="configModal" class="modal">
        <div class="modal-content">
            <h3>キーコンフィグ</h3>
            <div class="key-grid">
                <div>左カッ: <button id="key_ka_l" class="key-setter">F</button></div>
                <div>左ドン: <button id="key_don_l" class="key-setter">D</button></div>
                <div>右ドン: <button id="key_don_r" class="key-setter">J</button></div>
                <div>右カッ: <button id="key_ka_r" class="key-setter">K</button></div>
            </div>
            <button id="closeConfig" class="btn">保存</button>
        </div>
    </div>

    <main id="container">
        <section class="editor-section">
            <div class="ui-panel">
                <div class="control-group">
                    <label>難易度:</label>
                    <select id="courseSelect">
                        <option value="Edit">Edit (裏譜面)</option>
                        <option value="Oni">Oni (おに)</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>Grid:</label>
                    <select id="gridSnap">
                        <option value="16">16分</option>
                        <option value="32">32分</option>
                        <option value="48">3連(24分)</option>
                        <option value="128">128分</option>
                    </select>
                </div>
                <button id="parseBtn" class="mini-btn active">エディタ反映</button>
            </div>
            <textarea id="editor" spellcheck="false">（ここにTJAの中身を貼り付け）</textarea>
        </section>

        <section class="preview-section">
            <div class="canvas-wrapper">
                <canvas id="tjaCanvas"></canvas>
            </div>
            <div class="playback-ui">
                <button id="playBtn" class="btn" disabled>音楽を選択</button>
                <div class="time-info"><span id="timeDisplay">0.00 / 0.00</span></div>
            </div>
            <div class="status-bar">
                <p>💡 <b>TJA解析対応</b>: #SCROLL, #MEASURE, #GOGOSTART, #BARLINE 等に対応済み</p>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
